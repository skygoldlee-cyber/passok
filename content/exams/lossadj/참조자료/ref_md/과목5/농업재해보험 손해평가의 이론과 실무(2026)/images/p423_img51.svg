<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif">
  <title>그림 2-6 가지별 낙엽 판단 (예시)</title>
  <defs>
    <g id="leaf"><path d="M0 0 C 22 -18 26 -60 0 -92 C -26 -60 -22 -18 0 0z" fill="#f4f4f4" stroke="#333" stroke-width="1.6"/><path d="M0 0 V-88 M0 -24 l14 -14 M0 -44 l-14 -14 M0 -60 l12 -12 M0 -36 l-12 -10" stroke="#555" stroke-width="1" fill="none"/></g>
    <g id="bigleaf"><path d="M0 0 C 70 -30 76 -150 0 -230 C -76 -150 -70 -30 0 0z" fill="#e9e9e9" stroke="#333" stroke-width="1.8"/><path d="M0 4 V-222 M0 -40 l40 -40 M0 -80 l-42 -40 M0 -120 l40 -40 M0 -160 l-34 -32 M0 -60 l-38 -30 M0 -140 l36 -26" stroke="#555" stroke-width="1.1" fill="none"/></g>
  </defs>
  <rect width="1000" height="610" fill="#fff"/>
  <g><rect x="4" y="4" width="484" height="600" rx="10" fill="#fff" stroke="#e3e3e3"/><rect x="4" y="4" width="484" height="44" rx="8" fill="#8dc63f"/><text x="246" y="34" font-size="22" font-weight="700" fill="#2b3a14" text-anchor="middle">가지별 낙엽수 착엽수 산출 방법</text></g>
  <g><rect x="516" y="4" width="480" height="600" rx="10" fill="#fff" stroke="#e3e3e3"/><rect x="516" y="4" width="480" height="44" rx="8" fill="#8dc63f"/><text x="756" y="34" font-size="22" font-weight="700" fill="#2b3a14" text-anchor="middle">태풍피해를 입었으나 착엽으로 보는 경우</text></g>
  <!-- left: branch -->
  <path d="M40 500 L28 360 M44 380 Q 140 300 260 270 Q 360 246 420 250" stroke="#444" stroke-width="2" fill="none"/>
  <path d="M44 380 Q 200 330 420 250 L 420 262 Q 200 340 56 392z" fill="#e6e6e6"/>
  <path d="M44 380 Q 140 302 260 268 Q 360 244 420 248" stroke="#333" stroke-width="6" fill="none"/>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="64" y="342">1</text><text x="88" y="332">2</text><text x="142" y="296">4</text><text x="174" y="272">5</text><text x="204" y="270">6</text><text x="236" y="246">7</text><text x="280" y="246">8</text><text x="298" y="244">9</text><text x="340" y="246">10</text><text x="388" y="246">11</text><text x="422" y="246">12</text>
  </g>
  <g fill="#333"><circle cx="62" cy="366" r="3"/><circle cx="90" cy="350" r="3"/><circle cx="172" cy="292" r="3"/><circle cx="212" cy="292" r="3"/><circle cx="282" cy="264" r="3"/><circle cx="304" cy="254" r="3"/></g>
  <use href="#leaf" transform="translate(118,316) rotate(-12)"/>
  <use href="#leaf" transform="translate(146,316) rotate(170)"/>
  <use href="#leaf" transform="translate(246,262) rotate(4)"/>
  <use href="#leaf" transform="translate(340,262) rotate(172)"/>
  <use href="#leaf" transform="translate(372,248) rotate(20)"/>
  <use href="#leaf" transform="translate(402,260) rotate(118)"/>
  <text x="232" y="430" font-size="16" fill="#333">낙엽률 : 50%(착엽수 6잎, 낙엽수 6잎)</text>
  <!-- right panels -->
  <use href="#bigleaf" transform="translate(620,262) rotate(-8) scale(.82)"/>
  <path d="M592 120 q20 -6 46 -4 M598 152 q24 6 40 -4" stroke="#222" stroke-width="5" fill="none"/>
  <text x="672" y="122" font-size="13" fill="#333">찢겨진 자리</text>
  <text x="626" y="296" font-size="15" fill="#333" text-anchor="middle">[잎의 일부가 찢겨진 경우]</text>
  <g transform="translate(886,262) scale(.82)"><path d="M0 0 C 70 -30 76 -110 60 -170 L -60 -170 C -76 -110 -70 -30 0 0z" fill="#e9e9e9" stroke="#333" stroke-width="1.8"/><path d="M-60 -170 L 0 -200 L 120 -186 L 60 -170z" fill="#f6f6f6" stroke="#333"/><path d="M0 4 V-170 M0 -40 l40 -40 M0 -80 l-42 -40 M0 -120 l40 -40" stroke="#555" fill="none"/></g>
  <text x="808" y="110" font-size="13" fill="#333">꺽인 자리</text>
  <text x="886" y="296" font-size="15" fill="#333" text-anchor="middle">[잎의 50%미만에서 꺽인 경우]</text>
  <g transform="translate(624,560) scale(.82)"><path d="M0 0 C 70 -30 76 -110 60 -180 l-10 6 l-10 -8 l-10 8 l-10 -8 l-10 8 l-10 -8 l-10 8 l-10 -8 l-10 8 l-10 -6 C -76 -110 -70 -30 0 0z" fill="#e9e9e9" stroke="#333" stroke-width="1.8"/><path d="M0 4 V-176 M0 -40 l40 -40 M0 -80 l-42 -40 M0 -120 l40 -40" stroke="#555" fill="none"/></g>
  <text x="626" y="592" font-size="15" fill="#333" text-anchor="middle">[잎의 50%미만에서 잘린 경우]</text>
  <use href="#bigleaf" transform="translate(890,548) rotate(10) scale(.82)"/>
  <g fill="#222"><path d="M842 420 q-10 30 -4 60 q14 -10 16 -60z"/><path d="M928 470 q16 10 18 40 q-20 -6 -26 -36z"/><path d="M890 372 q22 -4 40 20 q-26 6 -40 -20z"/></g>
  <text x="826" y="388" font-size="12" fill="#333">찢겨진 곳</text><text x="944" y="540" font-size="12" fill="#333">찢겨진 곳</text>
  <text x="886" y="582" font-size="14" fill="#333" text-anchor="middle">[여러 곳이 찢어지고,꺽이고, 갈렸으나</text><text x="886" y="600" font-size="14" fill="#333" text-anchor="middle">전체 대비 50% 미만인 경우]</text>
</svg>
