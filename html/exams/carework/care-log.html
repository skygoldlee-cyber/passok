<!-- @spec none — carework 실무 뷰 마크업 (DA-13) -->
<section id="care-log-view" class="view-section" data-feature="careLog">
    <div class="view-header">
        <h2>요양일지 생성기</h2>
        <p class="view-subtitle">서비스 수행 내용 → 표준 기록 자동 작성 — 제공기준 고시 기록 항목 기반</p>
    </div>
    <div class="care-calc-form">
        <label>일시 <input id="log-date" type="date"></label>
        <label>대상자 성명 <input id="log-client" type="text" placeholder="예: 김○○"></label>
        <label>급여 종류 <select id="log-service"></select></label>
        <label>시작 <input id="log-start" type="time"></label>
        <label>종료 <input id="log-end" type="time"></label>
    </div>
    <div id="log-activities" class="care-log-activities"></div>
    <div class="care-calc-form">
        <label>특이사항 <input id="log-note" type="text" placeholder="대상자 상태 변화·전달 사항"></label>
        <div class="obs-chips"><span class="obs-label">식사량</span>
            <label class="obs-chip"><input type="radio" name="obs-meal" value="전"><span>전</span></label>
            <label class="obs-chip"><input type="radio" name="obs-meal" value="반"><span>반</span></label>
            <label class="obs-chip"><input type="radio" name="obs-meal" value="소"><span>소</span></label>
        </div>
        <div class="obs-chips"><span class="obs-label">수면</span>
            <label class="obs-chip"><input type="radio" name="obs-sleep" value="양호"><span>양호</span></label>
            <label class="obs-chip"><input type="radio" name="obs-sleep" value="불량"><span>불량</span></label>
            <label class="obs-chip"><input type="radio" name="obs-sleep" value="불면"><span>불면</span></label>
        </div>
        <div class="obs-chips"><span class="obs-label">배변</span>
            <label class="obs-chip"><input type="radio" name="obs-void" value="정상"><span>정상</span></label>
            <label class="obs-chip"><input type="radio" name="obs-void" value="이상"><span>이상</span></label>
        </div>
        <div class="care-calc-actions">
            <button data-click="careLogGenerate">일지 생성</button>
            <button data-click="careAiDraft" class="secondary">AI 초안</button>
            <button data-click="careLogSave" class="secondary">저장 <span class="pro-badge" data-pro-feature="care_log_save">PRO</span></button>

            <button data-click="careShare" data-arg="#log-preview pre|요양일지|mask|careLogGenerate|careLogCsvExport" class="secondary">공유</button>
            <button data-click="careLogCopy" class="secondary">복사 <span class="pro-badge" data-pro-feature="care_log_export">PRO</span></button>
            <button data-click="careLogRecordCopy" class="secondary">제공기록지 복사 <span class="pro-badge" data-pro-feature="care_log_export">PRO</span></button>
            <button data-click="careLogPrint" class="secondary">인쇄·PDF <span class="pro-badge" data-pro-feature="care_log_export">PRO</span></button>
            <button data-click="careLogCsvExport" class="secondary">Excel 내보내기 <span class="pro-badge" data-pro-feature="care_log_export">PRO</span></button>
        </div>
    </div>
    <div id="log-preview" class="care-calc-result"></div>
    <div id="log-saved" class="care-log-saved"></div>
</section>
