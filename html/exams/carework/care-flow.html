<!-- @spec none — carework 4단계 개념 학습 뷰 파셜 (DOC-USR-24) -->
<section id="care-flow-view" class="view-section" data-feature="careFlow">
    <div class="view-header">
        <h2>4단계 개념 학습</h2>
        <p class="view-desc">개념을 고르고 시작하면, 아는 부분은 건너뛰고 모르는 부분만 이야기로 배웁니다.</p>
    </div>
    <div class="care-calc-form">
        <label>과목
            <select id="flow-subject"></select>
        </label>
        <label>개념 선택
            <select id="flow-concept"></select>
        </label>
    </div>
    <div id="flow-progress" class="flow-progress" role="status"></div>
    <div id="flow-stage" class="webtoon-stage" data-step="home" aria-live="polite"></div>
    <div class="care-calc-actions" id="flow-actions">
        <button data-click="flowBack" class="btn btn-secondary" id="flow-back">◀ 이전</button>
        <button class="btn" data-click="flowNext" id="flow-next">다음 ▶</button>
    </div>
</section>
