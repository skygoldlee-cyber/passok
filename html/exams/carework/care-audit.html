<!-- @spec none — carework 실무 뷰 마크업 (DA-13) -->
<section id="care-audit-view" class="view-section" data-feature="careAudit">
    <div class="view-header">
        <h2>평가 체크리스트</h2>
        <p class="view-subtitle">장기요양기관 평가방법 고시 기반 — 인권·기록·감염·안전 4개 영역</p>
    </div>
    <div id="audit-progress" class="care-audit-progress"></div>
    <div id="audit-list" class="care-audit-list"></div>
    <details class="care-doc-preview"><summary>📄 점검표 미리보기</summary><div id="audit-preview"></div></details>
    <div class="care-calc-actions">
        <button data-click="careShare" data-arg="#audit-preview|평가 체크리스트||||careAuditPrint|care_audit_export|careAuditDocMd" class="btn btn-secondary">📤 공유·내보내기</button>
        <button data-click="careAuditReset" class="btn btn-secondary">🔄 점검 초기화</button>
        <button data-click="careAuditFilePick" class="btn btn-secondary">📄 기관 점검표 불러오기</button>
        <input id="audit-file" type="file" accept=".docx,.hwpx,.xlsx,.xls,.csv" class="is-hidden">
        <button id="audit-custom-reset" data-click="careAuditFileReset" class="btn btn-secondary is-hidden">↩ 기본 점검표 복원</button>
    </div>
    <p id="audit-custom-note" class="care-log-hint is-hidden">기관 업로드 점검표 사용 중 — 기본 고시 점검표가 아닙니다.</p>
    <p class="care-log-hint"><strong>기관 점검표 불러오기</strong> — 기관이 제공하는 점검표 파일(.docx·.hwpx·.xlsx·.csv)을 올리면 점검 항목이 기관 내용으로 바뀝니다. 기본으로 돌리려면 "기본 점검표 복원"을 누르세요.</p>
</section>
