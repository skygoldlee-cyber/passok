<!-- @spec none — carework 실무 뷰 마크업 (DA-13) -->
<section id="care-custom-form-view" class="view-section" data-feature="careCustomForm">
    <div class="view-header">
        <h2>기관 양식</h2>
        <p class="view-subtitle">기관 자체 서식 등록 → {{항목}} 기입 → 출력 — 기본 실무 양식 외 자유 서식</p>
    </div>

    <div class="view-header"><h3>기본 양식</h3></div>
    <p class="care-log-hint">앱 기본 서식의 사본을 만들어 항목을 수정·추가할 수 있습니다 — 원본 양식은 그대로 유지되고, 사본은 해당 도구 출력 서식에도 반영됩니다.</p>
    <div id="cf-seed-list" class="care-log-saved"></div>

    <div id="cf-editor" class="care-calc-form is-hidden">
        <h3>양식 편집 — <span id="cf-tpl-label"></span></h3>
        <label>양식명 <input id="cf-tpl-title" type="text" autocomplete="off"></label>
        <div class="care-calc-actions">
            <button type="button" class="btn btn-secondary" data-click="careFormTplPdfPick">📄 파일에서 추출 <span class="pro-badge" data-pro-feature="care_form_extract">PRO</span></button>
            <input id="cf-tpl-file" type="file" accept=".pdf,.docx,.xlsx,.xls,.csv,application/pdf" class="is-hidden">
        </div>
        <label>양식 본문 (마크다운) <textarea id="cf-tpl-body" rows="8" placeholder="기입란은 {{항목}} 형태로 표기 — 시스템 키: date·org·author·confirmer·receiver·client·signImage 는 자동 기입"></textarea></label>
        <div id="cf-tpl-fields"></div>
        <div class="care-calc-actions">
            <button class="btn" data-click="careFormTplSave">💾 양식 저장</button>
            <button class="btn btn-secondary" data-click="careFormTplEditClose">닫기</button>
        </div>
    </div>

    <div class="view-header"><h3>등록된 양식</h3></div>
    <p class="care-log-hint">새 양식 등록은 <a href="#/care-home">Care OS 홈</a> 또는 위의 양식 파일 업로드로도 가능합니다.</p>
    <div id="cf-tpl-list" class="care-log-saved"></div>

    <div id="cf-fill" class="care-calc-form is-hidden">
        <h3>양식 기입 — <span id="cf-fill-title"></span></h3>
        <label>대상자 성명 <input id="cf-client" type="text" placeholder="예: 김○○"></label>
        <div id="cf-fill-fields"></div>
        <div class="care-calc-actions">
            <button class="btn" data-click="careFormDocGenerate">📄 문서 생성</button>
            <button class="btn btn-secondary" data-click="careFormDocSave">💾 문서 저장 <span class="pro-badge" data-pro-feature="care_form_save">PRO</span></button>
            <button data-click="careShare" data-arg="#cf-preview|양식 문서|mask|careFormDocGenerate||careFormDocPrint|care_form_share|careFormDocMd" class="btn btn-secondary">📤 공유·내보내기</button>
        </div>
    </div>
    <div id="cf-preview" class="care-calc-result"></div>

    <div class="view-header"><h3>기입 문서</h3></div>
    <div id="cf-doc-list" class="care-log-saved"></div>
</section>
