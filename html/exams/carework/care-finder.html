<!-- @spec none — carework 실무 뷰 마크업 (DA-13) -->
<section id="care-finder-view" class="view-section" data-feature="careFinder">
    <div class="view-header">
        <h2>요양기관 찾기</h2>
        <p class="view-subtitle">장기요양기관 검색 — 기관 가입·출력물 기관명 연결</p>
        <p id="find-hint" class="care-log-hint is-hidden">출력물에 표기될 기관명을 선택하세요.</p>
        <p class="care-log-hint"><a href="https://www.longtermcare.or.kr/npbs/r/a/201/selectLtcoSrch" target="_blank" rel="noopener">장기요양보험 기관검색(공단) ↗</a></p>
    </div>
    <div class="care-calc-form">
        <label>검색어 <input id="find-q" type="search" placeholder="시설명·주소·전화번호"></label>
        <label>지역 <select id="find-region"><option value="">전체 지역</option></select></label>
        <div class="care-calc-actions"><button data-click="careFinderSearch">🔍 검색</button></div>
        <p id="find-source" class="care-log-hint"></p>
    </div>
    <div id="find-list" class="care-log-saved"></div>
</section>
