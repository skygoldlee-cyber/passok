<!-- @spec none — carework 실무 뷰 마크업 (DA-13) -->
<section id="care-handover-view" class="view-section" data-feature="careHandover">
    <div class="view-header">
        <h2>인수인계서</h2>
        <p class="view-subtitle">교대근무 인수인계 자동 작성 — 당일 일지 병합 가능</p>
    </div>
    <div class="care-calc-form">
        <label>일시 <input id="ho-date" type="date"></label>
        <label>근무조 <select id="ho-shift"></select></label>
        <label>인계자 <input id="ho-from" type="text" placeholder="예: 김○○"></label>
        <label>인수자 <input id="ho-to" type="text" placeholder="예: 박○○"></label>
        <label>대상자 <input id="ho-clients" type="text" placeholder="예: 302호 김○○, 305호 이○○"></label>
    </div>
    <div class="care-calc-form">
        <label>대상자 상태 <input id="ho-status" type="text" placeholder="식사·배변·컨디션 요약"></label>
        <label>미완료·인계 작업 <input id="ho-tasks" type="text" placeholder="남은 작업·예약"></label>
        <label>특이 주의사항 <input id="ho-caution" type="text" placeholder="낙상 주의·약물·가족 연락"></label>
        <label class="care-log-merge"><input id="ho-merge" type="checkbox" checked> 당일 저장 일지 병합 <span id="ho-logcount"></span></label>
        <div class="care-calc-actions">
            <button data-click="careHandoverDigest" class="secondary">📅 오늘 기록으로 채우기</button>
            <button data-click="careAiDraft" data-arg="ho" class="secondary">✨ AI 초안</button>
            <button data-click="careHandoverGenerate">🤝 인수인계 생성</button>
            <button data-click="careHandoverSave" class="secondary">💾 기록 저장 <span class="pro-badge" data-pro-feature="care_handover_save">PRO</span></button>
            <button data-click="careShare" data-arg="#ho-preview pre|인수인계서|mask|careHandoverGenerate||careHandoverPrint|care_handover_share" class="secondary">📤 공유·내보내기</button>
            <button data-click="careHandoverCopy" class="secondary">📋 복사</button>
        </div>
    </div>
    <div id="ho-preview" class="care-calc-result"></div>
    <div id="ho-facility" class="care-log-facility"></div>
    <div class="view-header"><h3>기관 기록 보관함</h3><p class="view-subtitle">공유 전 저장 필수 — 저장본이 기관 기록이 됩니다</p></div>
    <div id="ho-saved" class="care-log-saved"></div>
</section>
