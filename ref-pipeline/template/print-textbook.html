<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>%%TITLE%%</title>
<style>
  /* 교재 전용 인쇄 템플릿 — 표지·목차 + 러닝헤드/쪽수 스탬프용 상하 여백 확보.
     스탬프(헤더 10mm·푸터 10mm)는 textbook_pdf.py가 PDF 후처리로 심는다 */
  @page { size: A4; margin: 22mm 16mm 20mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 10.5pt;
    line-height: 1.65;
    color: #1a1a1a;
    max-width: 178mm;
    margin: 0 auto;
  }
  h1 { font-size: 20pt; border-bottom: 3px solid #333; padding-bottom: 6px;
       page-break-after: avoid; }
  h2 { font-size: 15pt; border-bottom: 1.5px solid #999; padding-bottom: 4px;
       margin-top: 1.6em; page-break-after: avoid; }
  h3 { font-size: 12.5pt; margin-top: 1.3em; page-break-after: avoid; }
  h4 { font-size: 11pt; margin-top: 1.1em; page-break-after: avoid; }
  .keep { page-break-inside: avoid; }
  .new-page { page-break-before: always; }
  p { margin: 0.55em 0; orphans: 3; widows: 3; }
  a { color: #1a56db; text-decoration: none; }
  ul, ol { margin: 0.4em 0; padding-left: 1.6em; }
  li { margin: 0.2em 0; page-break-inside: avoid; }
  blockquote {
    margin: 0.7em 0; padding: 0.6em 1em;
    border-left: 4px solid #c9d4e4; background: #f4f7fb;
    color: #333; page-break-inside: avoid;
  }
  code {
    font-family: Consolas, "Courier New", monospace;
    font-size: 9.5pt; background: #f1f3f5; padding: 1px 4px; border-radius: 3px;
  }
  pre {
    background: #f6f8fa; border: 1px solid #d8dce3; border-radius: 6px;
    padding: 10px 12px; font-size: 8.5pt; line-height: 1.5;
    white-space: pre-wrap; word-break: break-all; page-break-inside: avoid;
  }
  pre.long-pre { page-break-inside: auto; }
  pre code { background: none; padding: 0; font-size: inherit; }
  table {
    border-collapse: collapse; width: 100%; margin: 0.7em 0;
    font-size: 9.5pt; page-break-inside: avoid;
  }
  th, td { border: 1px solid #c9ced6; padding: 5px 8px; text-align: left;
           vertical-align: middle; }
  th { background: #eef1f5; font-weight: 700; text-align: center; }
  .kv > tbody > tr > td:first-child, .kv > tr > td:first-child { text-align: center; }
  tr { page-break-inside: avoid; }
  thead { display: table-header-group; }
  hr { border: none; border-top: 1px solid #ccc; margin: 1.2em 0; }
  img, svg { max-width: 100%; max-height: 245mm; height: auto; page-break-inside: avoid; }
  .mermaid, .mermaid-img { text-align: center; margin: 0.8em 0; page-break-inside: avoid; }
  .concept-qr { page-break-inside: avoid; }

  /* ── 표지 ── */
  .tb-cover {
    height: 255mm; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    page-break-after: always;
  }
  .tb-cover .brand { font-size: 11pt; letter-spacing: 0.4em; color: #64748b;
    text-transform: uppercase; margin-bottom: 18mm; }
  .tb-cover .subtitle { font-size: 13pt; color: #475569; margin-bottom: 8mm; }
  .tb-cover .title { font-size: 30pt; font-weight: 800; line-height: 1.3;
    border-top: 4px solid #1a1a1a; border-bottom: 4px solid #1a1a1a;
    padding: 10mm 0; margin-bottom: 14mm; }
  .tb-cover .badge { display: inline-block; font-size: 10pt; color: #334155;
    border: 1.5px solid #94a3b8; border-radius: 999px; padding: 3mm 8mm;
    margin-bottom: 10mm; }
  .tb-cover .date { font-size: 10pt; color: #64748b; margin-top: auto; }

  /* ── 목차 — 절별 제목+점선 리더+쪽수, 내부 링크(#id)는 PDF에서 GoTo 유지 ── */
  .tb-toc { page-break-after: always; }
  .tb-toc .tt { font-size: 18pt; font-weight: 800; text-align: center;
    margin: 8mm 0 10mm; letter-spacing: 0.3em; }
  .tb-toc .e a { display: flex; align-items: baseline; color: #1a1a1a; }
  .tb-toc .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150mm; }
  .tb-toc .dots { flex: 1; border-bottom: 1px dotted #94a3b8; margin: 0 2mm 1mm; min-width: 6mm; }
  .tb-toc .n { width: 8mm; text-align: right; font-variant-numeric: tabular-nums; }
  .tb-toc .ch { font-weight: 700; font-size: 11.5pt; margin-top: 4mm; }
  .tb-toc .sec { padding-left: 7mm; font-size: 9.5pt; color: #334155; }
  .tb-toc .plain { font-weight: 700; margin-top: 4mm; }
</style>
</head>
<body>
%%COVER%%
%%TOC%%
%%BODY%%
</body>
</html>
