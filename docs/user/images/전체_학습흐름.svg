<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" width="980" height="610" role="img" aria-labelledby="t d">
  <title id="t">전체 학습 흐름</title>
  <desc id="d">시험일 설정, 교재 1회독, 주간 배분, 매일 실행, 학습 진단의 순환과 보조 학습 구성</desc>
  <style>
    svg { font-family: Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    .bg { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .cyc { fill: #ecfeff; stroke: #0d9488; stroke-width: 1.8; }
    .goal { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; }
    .band { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .pill { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
    .loopzone { fill: #0d9488; fill-opacity: 0.05; stroke: #0d9488; stroke-opacity: 0.35; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .h1 { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 13px; fill: #64748b; }
    .ttl { font-size: 16px; font-weight: 700; fill: #0f172a; }
    .txt { font-size: 12.5px; fill: #475569; }
    .lbl { font-size: 12px; font-weight: 600; fill: #0f766e; }
    .lblg { font-size: 12px; font-weight: 600; fill: #c2410c; }
    .lbls { font-size: 12px; font-weight: 600; fill: #64748b; }
    .ptxt { font-size: 13px; font-weight: 600; fill: #334155; }
    .num { fill: #0d9488; }
    .numg { fill: #ea580c; }
    .numt { font-size: 13px; font-weight: 800; fill: #ffffff; }
    .pro { fill: #7c3aed; }
    .prot { font-size: 10px; font-weight: 800; fill: #ffffff; }
    .arr { stroke: #0d9488; stroke-width: 2; fill: none; }
    .arrg { stroke: #ea580c; stroke-width: 2; fill: none; }
    .arrs { stroke: #94a3b8; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #0d9488; }
    .headg { fill: #ea580c; }
    .heads { fill: #94a3b8; }
    .badge { fill: #0d9488; }
    .badget { font-size: 12px; font-weight: 700; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #334155; }
      .cyc { fill: #0f2e30; stroke: #2dd4bf; }
      .goal { fill: #2a1a0e; stroke: #fb923c; }
      .band { fill: #172033; stroke: #334155; }
      .pill { fill: #1e293b; stroke: #475569; }
      .loopzone { fill: #2dd4bf; stroke: #2dd4bf; }
      .h1, .ttl { fill: #f1f5f9; }
      .sub, .lbls { fill: #94a3b8; }
      .txt { fill: #cbd5e1; }
      .ptxt { fill: #e2e8f0; }
      .lbl { fill: #5eead4; }
      .lblg { fill: #fdba74; }
      .num, .badge { fill: #14b8a6; }
      .arr { stroke: #2dd4bf; }
      .head { fill: #2dd4bf; }
      .arrg { stroke: #fb923c; }
      .headg { fill: #fb923c; }
      .arrs { stroke: #64748b; }
      .heads { fill: #64748b; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="headg" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="heads" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="610" rx="16"/>
  <text class="h1" x="30" y="44">전체 학습 흐름</text>
  <text class="sub" x="190" y="44">시험일 설정에서 시작해, 주간 배분 ↔ 학습 진단 순환으로 합격 갭을 좁힙니다</text>

  <!-- 순환 영역 -->
  <rect class="loopzone" x="495" y="76" width="470" height="338" rx="14"/>

  <!-- ① 시험일 설정 -->
  <rect class="box" x="30" y="90" width="200" height="110" rx="12"/>
  <circle class="num" cx="52" cy="114" r="12"/><text class="numt" x="52" y="118.5" text-anchor="middle">1</text>
  <text class="ttl" x="72" y="120">시험일 설정</text>
  <text class="txt" x="46" y="148">학습 캘린더 › 목표 설정</text>
  <text class="txt" x="46" y="168">D-day · 역산 하루 N장</text>
  <text class="txt" x="46" y="188">권장 준비 기간 63일*</text>

  <!-- ② 교재 1회독 -->
  <rect class="box" x="270" y="90" width="200" height="110" rx="12"/>
  <circle class="num" cx="292" cy="114" r="12"/><text class="numt" x="292" y="118.5" text-anchor="middle">2</text>
  <text class="ttl" x="312" y="120">교재 1회독</text>
  <text class="txt" x="286" y="148">교재리더 표준형·이야기형</text>
  <text class="txt" x="286" y="168">실제 머문 구간만 일독 집계</text>
  <text class="txt" x="286" y="188">남은 통독일 → 계획 반영</text>

  <!-- ③ 주간 배분 -->
  <rect class="cyc" x="510" y="90" width="200" height="110" rx="12"/>
  <circle class="num" cx="532" cy="114" r="12"/><text class="numt" x="532" y="118.5" text-anchor="middle">3</text>
  <text class="ttl" x="552" y="120">주간 배분</text>
  <rect class="pro" x="672" y="106" width="30" height="16" rx="8"/><text class="prot" x="687" y="117.5" text-anchor="middle">PRO</text>
  <text class="txt" x="526" y="148">출제 비중 10:25:25:40</text>
  <text class="txt" x="526" y="168">× 약점 가중</text>
  <text class="txt" x="526" y="188">주차 × 과목 배정 칩</text>

  <!-- ④ 매일 실행 -->
  <rect class="cyc" x="750" y="90" width="200" height="110" rx="12"/>
  <circle class="num" cx="772" cy="114" r="12"/><text class="numt" x="772" y="118.5" text-anchor="middle">4</text>
  <text class="ttl" x="792" y="120">매일 실행</text>
  <text class="txt" x="766" y="148">데일리 챌린지 8문 · 🔥</text>
  <text class="txt" x="766" y="168">플래시카드 (FSRS 복습)</text>
  <text class="txt" x="766" y="188">기출 퀴즈 · O/X·ㄱㄴㄷ 드릴</text>

  <!-- ⑤ 학습 진단 -->
  <rect class="cyc" x="630" y="290" width="200" height="110" rx="12"/>
  <circle class="num" cx="652" cy="314" r="12"/><text class="numt" x="652" y="318.5" text-anchor="middle">5</text>
  <text class="ttl" x="672" y="320">학습 진단</text>
  <rect class="pro" x="792" y="306" width="30" height="16" rx="8"/><text class="prot" x="807" y="317.5" text-anchor="middle">PRO</text>
  <text class="txt" x="646" y="348">오답 패턴 · 취약 진술</text>
  <text class="txt" x="646" y="368">단원 숙달(BKT) · 합격 갭</text>
  <text class="txt" x="646" y="388">주간 리포트 공유</text>

  <!-- 목표: 시험 D-day -->
  <rect class="goal" x="30" y="290" width="440" height="110" rx="12"/>
  <circle class="numg" cx="52" cy="314" r="12"/><text class="numt" x="52" y="318.5" text-anchor="middle">★</text>
  <text class="ttl" x="72" y="320">시험 D-day · 합격</text>
  <text class="txt" x="46" y="348">합격 기준: 평균 60점 이상 + 전 과목 40점 이상(과락선)</text>
  <text class="txt" x="46" y="368">모의고사 2회↑ 응시 시 예상 점수 대 · 추세 표시</text>
  <text class="txt" x="46" y="388">D-day 경과 후 실제 결과 기록 → 예측 정확도 향상</text>

  <!-- 주 흐름 화살표 -->
  <path class="arr" d="M230,145 H266" marker-end="url(#a)"/>
  <path class="arr" d="M470,145 H506" marker-end="url(#a)"/>
  <path class="arr" d="M710,145 H746" marker-end="url(#a)"/>
  <text class="lbl" x="728" y="80" text-anchor="middle">이번 주 목표</text>

  <!-- 순환: ④ → ⑤ → ③ -->
  <path class="arr" d="M850,200 V345 H834" marker-end="url(#a)"/>
  <text class="lbl" x="858" y="252">학습 기록</text>
  <path class="arr" d="M660,290 V204" marker-end="url(#a)"/>
  <text class="lbl" x="668" y="240">약점 가중</text>
  <text class="lbl" x="668" y="256">자동 재배분</text>
  <rect class="badge" x="742" y="234" width="86" height="24" rx="12"/>
  <text class="badget" x="785" y="250.5" text-anchor="middle">↻ 매주 순환</text>

  <!-- ⑤ → 목표 -->
  <path class="arrg" d="M630,345 H474" marker-end="url(#ag)"/>
  <text class="lblg" x="552" y="335" text-anchor="middle">합격 갭 해소</text>

  <!-- 보조 학습 -->
  <rect class="band" x="20" y="450" width="940" height="140" rx="14"/>
  <text class="ttl" x="40" y="480">보조 학습</text>
  <text class="sub" x="122" y="480">약점 보강·실전 감각·빠른 탐색 — 순환 루프와 병행</text>

  <rect class="pill" x="40" y="500" width="140" height="70" rx="10"/>
  <text class="ptxt" x="110" y="530" text-anchor="middle">오답/중요 복습</text>
  <text class="txt" x="110" y="550" text-anchor="middle">헷갈림·오답 모음</text>

  <rect class="pill" x="192" y="500" width="140" height="70" rx="10"/>
  <text class="ptxt" x="262" y="530" text-anchor="middle">실전 모의고사</text>
  <text class="txt" x="262" y="550" text-anchor="middle">100문 · OMR · 120분</text>

  <rect class="pill" x="344" y="500" width="140" height="70" rx="10"/>
  <text class="ptxt" x="414" y="530" text-anchor="middle">훈련소</text>
  <text class="txt" x="414" y="550" text-anchor="middle">수치 암기 · 배합 계산</text>

  <rect class="pill" x="496" y="500" width="140" height="70" rx="10"/>
  <text class="ptxt" x="566" y="530" text-anchor="middle">성분 사전</text>
  <text class="txt" x="566" y="550" text-anchor="middle">초성 검색 · 배합 한도</text>

  <rect class="pill" x="648" y="500" width="140" height="70" rx="10"/>
  <text class="ptxt" x="718" y="530" text-anchor="middle">통합 검색</text>
  <text class="txt" x="718" y="550" text-anchor="middle">Ctrl+K · 교재 본문</text>

  <rect class="pill" x="800" y="500" width="140" height="70" rx="10"/>
  <text class="ptxt" x="870" y="530" text-anchor="middle">뽀모도로 타이머</text>
  <text class="txt" x="870" y="550" text-anchor="middle">25분 집중 + 5분 휴식</text>

  <!-- 보조 → 순환 연결 -->
  <path class="arrs" d="M930,446 V418" marker-end="url(#as)"/>
  <text class="lbls" x="922" y="436" text-anchor="end">약점 보강</text>

  <text class="txt" x="40" y="600">* 90일의 근거 — 문제은행 1,937문 1회전을 학습일당 ~30문 페이스로 소화(약 64학습일)하는 데 필요한 달력일(64×7/5≈90)</text>
</svg>
