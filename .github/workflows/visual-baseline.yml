name: Visual Baselines

# 시각 회귀 기준선(*-linux.png) 생성 전용.
# 픽셀 기준선은 OS·폰트 래스터에 바인딩되므로 CI와 동일한 ubuntu-latest 러너에서
# 생성해야 한다. CI 시각 회귀 실패 시 자동으로 재생성·커밋하고 수동 트리거도 지원한다.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run: 실패한 커밋 기준으로 기준선 생성·커밋
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # 생성물은 gitignore 대상 — 스냅샷 서빙 전 빌드 필수
      - name: 생성 번들 빌드 (gitignore 대상)
        run: npm run build:html && npm run build:data && npm run build:drills && node tools/build/build_doc_bundles.js

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Linux snapshots
        run: npx playwright test tests/e2e/visual.spec.js --update-snapshots

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots-linux
          path: tests/e2e/visual.spec.js-snapshots/
          retention-days: 30

      # 자동 트리거(실패) 시 재생성 기준선을 커밋·푸시해 CI가 다음 런에서 통과하도록
      - name: Commit regenerated baselines (auto-run only)
        if: github.event_name == 'workflow_run'
        run: |
          git config user.name "devin-ai-integration[bot]"
          git config user.email "158243242+devin-ai-integration[bot]@users.noreply.github.com"
          git add tests/e2e/visual.spec.js-snapshots/
          git commit -m "test(e2e): 시각 기준선 자동 재생성 — CI 실패 감지 후 복구 (linux) [skip ci]" || true
          git push
