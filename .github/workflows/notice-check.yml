name: Law·Notice Check

# 매주 월요일 09:00 KST(UTC 00:00) — 전 시험 팩의 참조 법령·고시를
# law.go.kr 오픈API로 조회해 notice_status.json을 갱신하고,
# 신규 고시 발견 시 이슈를 자동 생성한다. 앱은 raw JSON을 읽어 배너로 표시.
#
# 감시 대상: 각 시험 references.json의 referenceLaw (ref_md 파일 추가 시 자동 반영).
# 파일명 '{문서명}({발령기관})({제N호})({시행일})'이 baseline이다.
#
# 매년 11/1 09:00 KST — 차년도 Q-Net 출제기준·시행계획 공고 확인 리마인더 이슈.

on:
  schedule:
    - cron: '0 0 * * 1'    # 주간 법령·고시 개정 감시
    - cron: '0 0 1 11 *'   # 연간 출제기준 확인 리마인더 (11/1)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 전 시험 법령·고시 조회 + 상태 파일 갱신
        id: check
        env:
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
        run: |
          set +e
          : > /tmp/changed_docs.txt
          : > /tmp/newer_exams.txt
          any=0
          for refs in content/exams/*/references.json; do
            exam=$(basename "$(dirname "$refs")")
            node -e "process.exit((require('./$refs').referenceLaw||[]).length?0:1)" || {
              echo "── $exam — referenceLaw 없음, 건너뜀"; continue; }
            echo "── $exam — 감시 시작"
            python ref-pipeline/check_mfds_notice.py --exam "$exam" --update
            code=$?
            if [ "$code" -eq 2 ]; then
              any=1
              echo "$exam" >> /tmp/newer_exams.txt
              node -e "
                const d=require('./content/exams/$exam/notice_status.json');
                for (const x of d.docs||[]) if (x.newer)
                  console.log(\`- [$exam] \${x.name}: \${x.baselineNotice||''}(\${x.baselineDate||''}) → \${x.latestNotice||''}(\${x.latestDate||''})\`);
              " >> /tmp/changed_docs.txt
            elif [ "$code" -ne 0 ]; then
              echo "::warning::$exam — 조회 스크립트 실패 (exit $code)"
            fi
          done
          set -e
          echo "newer=$any" >> "$GITHUB_OUTPUT"

      - name: 개정 조문 대조 — 실질 변경 여부 판별
        # 시행일 갱신 ≠ 내용 개정 — 유예조항 발효 연혁본은 본문이 동일할 수 있다.
        # diff_revision.py가 신규본을 DRF에서 재수집해 조문 단위로 대조한다.
        if: steps.check.outputs.newer == '1'
        env:
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
        run: |
          set +e
          : > /tmp/diff_summary.txt
          while read -r exam; do
            [ -n "$exam" ] || continue
            echo "── $exam — 조문 대조"
            python ref-pipeline/diff_revision.py --exam "$exam"
            rep="content/exams/$exam/report/법령개정대조결과.md"
            if [ -f "$rep" ]; then cat "$rep" >> /tmp/diff_summary.txt; fi
          done < /tmp/newer_exams.txt
          exit 0

      - name: law.go.kr 한글주소 유효성 검증
        id: urls
        run: |
          set +e
          node tools/check/check_law_urls.js
          code=$?
          set -e
          echo "broken=$code" >> "$GITHUB_OUTPUT"

      - name: 결과 커밋 (notice_status.json 변경 시)
        run: |
          git add 'content/exams/*/notice_status.json'
          if git diff --cached --quiet; then
            echo "상태 변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(notice): 법령·고시 감시 상태 갱신 $(date -u +%F)"
            git push
          fi

      - name: 끊어진 한글주소 이슈 생성
        if: steps.urls.outputs.broken != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh issue list --state open --search 'in:title 한글주소 링크 깨짐' --limit 1)" ]; then
            echo "동일 이슈 이미 열려 있음 — 생성 생략"; exit 0
          fi
          gh issue create \
            --title "🔗 law.go.kr 한글주소 링크 깨짐 — law-links.js 매핑 갱신 필요" \
            --label "bug" \
            --body "$(cat <<'ISSUE'
          주간 체크에서 `tools/check/check_law_urls.js`가 law.go.kr 한글주소 오류를 감지했습니다.
          법령·고시 폐지 또는 명칭 변경이 원인일 수 있습니다.

          ## 확인 절차
          1. 워크플로 로그에서 ✗ 표시된 URL 확인
          2. `src/law-links.js`의 매칭 패턴/한글주소 갱신
          3. `npm.cmd run check:lawurls` 로컬 검증
          ISSUE
          )"

      - name: 신규 법령·고시 이슈 생성
        if: steps.check.outputs.newer == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh issue list --state open --search 'in:title 법령·고시 개정 감지' --limit 1)" ]; then
            echo "개정 감지 이슈 이미 열려 있음 — 생성 생략"; exit 0
          fi
          CHANGED=$(cat /tmp/changed_docs.txt)
          DIFFS=$(head -c 40000 /tmp/diff_summary.txt 2>/dev/null || echo "(대조 리포트 없음)")
          gh issue create \
            --title "🔔 법령·고시 개정 감지 — 참조 문서 갱신 필요" \
            --label "content" \
            --body "$(cat <<ISSUE
          law.go.kr 오픈API 주간 체크에서 참조 법령·고시의 개정을 감지했습니다.

          ## 감지된 문서
          $CHANGED

          ## 조문 대조 판정
          시행일 갱신이 곧 내용 개정은 아닙니다 — 유예조항 발효 등으로
          본문이 동일한 연혁본일 수 있습니다 (판정 '본문 동일'이면
          파일명 시행일만 갱신하면 됩니다).

          $DIFFS

          ## 갱신 절차
          1. \`python ref-pipeline/diff_revision.py --exam <id>\` — 조문 대조 재확인
          2. 실질 개정이면 \`python ref-pipeline/fetch_revision.py --exam <id>\` — 신판 원문 자동 확보(행정규칙은 첨부 PDF까지)
             또는 법령정보센터에서 최신 문서 확보 → \`content/exams/<id>/참조자료/\` 교체
          3. \`npm.cmd run convert:refs\` → ref_md 변환 후 해당 과목 폴더에 승격
          4. \`node tools/sync/sync_citation_lines.js\` — 교재·문제은행 인용 재해석,
             미발견 인용 = 개정으로 내용이 바뀐 지점 → 교재·해설 정정
          5. 파일명의 (제N호)(시행일)을 새 고시로 바꾸면 baseline이 자동 갱신됨
          ISSUE
          )"

      - name: 연간 출제기준 확인 리마인더 (11/1)
        if: github.event_name == 'schedule' && github.event.schedule == '0 0 1 11 *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT_YEAR=$(($(date -u +%Y) + 1))
          if [ -n "$(gh issue list --state open --search 'in:title 출제기준 확인' --limit 1)" ]; then
            echo "출제기준 확인 이슈 이미 열려 있음 — 생성 생략"; exit 0
          fi
          EXAMS=$(node -e "
            const d=require('./content/exams.json');
            for (const e of d.exams||[]) {
              if (e.comingSoon || e.tier==='draft') continue;
              console.log(\`- [ ] \${e.id} — \${e.title||e.name||''} (\${e.tier||'active'})\`);
            }")
          gh issue create \
            --title "📋 ${NEXT_YEAR}년도 출제기준·시행계획 확인 — 전 시험 팩" \
            --label "content" \
            --body "$(cat <<ISSUE
          Q-Net 등 시행기관이 차년도 출제기준·시행계획을 연말에 공고합니다.
          팩별로 아래를 확인하세요 (법령·고시 개정은 주간 체크가 별도 감시).

          ## 대상 시험 (pilot·active)
          $EXAMS

          ## 확인 절차 (시험별)
          1. Q-Net(또는 시행기관) ${NEXT_YEAR}년도 출제기준 공고 확인
          2. 변경 시 신판 출제기준 PDF → \`content/exams/<id>/참조자료/\` 교체
          3. \`npm.cmd run convert:refs\` → ref_md 승격 → 출제 범위·과목 구성 대조
          4. 과목·배점 구조 변경이면 \`manifest.json\`의 syllabus·integratedExam 갱신
          ISSUE
          )"
