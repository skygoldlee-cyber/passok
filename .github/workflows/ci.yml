name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 연속 푸시 시 구 커밋 실행을 취소해 러너·과금 절약 (월타임에는 무관)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # e2e 스킵 판정 — 문서 전용 변경(docs/**·루트 *.md·tmp/**)이면 E2E 불필요.
  # 워크플로 paths-ignore는 check-run 자체가 안 생겨 배포 가드를 막으므로
  # 잡 if: 방식으로 제어 — 스킵된 잡은 워크플로 conclusion에 영향 없음.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # before/base 대비 diff 판정에 필요
      - name: Detect code-affecting changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: node tools/check/detect_code_changes.js

  # 생성 번들(index.html·data/)은 gitignore라 클론에 없다 — 1회 빌드 후
  # 아티팩트로 공유해 test·e2e 잡의 중복 빌드(레그당 ~1분×8)를 제거한다.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: 생성 번들 빌드 (gitignore 대상)
        run: npm run build:html && npm run build:data && npm run build:drills && node tools/build/build_doc_bundles.js
      - name: Upload generated bundles
        uses: actions/upload-artifact@v4
        with:
          name: generated-bundles
          path: |
            index.html
            data/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # PR 영향 분석(diff)에 필요

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download generated bundles
        uses: actions/download-artifact@v4
        with:
          name: generated-bundles

      - name: Dependency audit (high+ 취약점 차단)
        run: npm audit --audit-level=high

      - name: Generate SBOM (SPDX)
        run: npm run sbom

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

      - name: Secret scan (추적 파일 비밀키 패턴)
        run: npm run check:secrets

      - name: Lint
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npm run check:types

      - name: Import/export cross-check
        run: npm run check:imports

      - name: Supabase schema applied probe (선언 테이블 프로덕션 존재)
        run: npm run check:supabase

      - name: Position-independence gate (교재 좌표 비의존 식별자·저장 키)
        run: npm run check:posind

      - name: Content-independence gate (시험/교재 식별자 하드코딩 차단, DA-15)
        run: npm run check:contentind

      - name: Docs path + document ID check
        run: npm run check:docs

      - name: Domain map (파일 계층 분류)
        run: npm run check:domainmap

      - name: UI text coverage
        run: npm run check:uitext

      - name: Mobile safety convention (다이얼로그·버튼 행 규약)
        run: npm run check:mobilesafe

      - name: HTML escape sink check (innerHTML 보간 이스케이프 규약)
        run: npm run check:escape

      - name: UI style convention (인라인 스타일·display 조작 규약)
        run: npm run check:uistyle

      # dependabot PR은 package(-lock).json 변경만 발생시켜 이 게이트가 항상 실패한다 —
      # 봇은 문서 갱신·[no-docs] 마크가 불가하므로 PR 작성자 기준으로 면제한다.
      - name: Doc sync gate (소스 변경 시 문서 갱신 강제)
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: node tools/check/check_doc_sync.js --ref origin/main

      - name: Test-first gate (로직 변경 시 테스트 동반 강제)
        run: node tools/check/check_test_first.js --ref origin/main

      - name: SPEC refs + test gap check
        run: npm run check:specrefs

      - name: TRACE MATRIX freshness
        run: npm run check:trace

      - name: index.html 조립 신선도
        run: npm run check:html

      - name: Content traceability (교재/문제은행 변경 게이트)
        run: node tools/check/check_content.js --content-only --quick

      # plain `npm test`는 coverage:unit과 동일 스위트의 중복 실행 — CI는 c8 실행으로 대체
      - name: Run DOM tests with coverage
        run: npm run coverage

      - name: Run unit tests with coverage (c8)
        run: npm run coverage:unit

      - name: Merged coverage threshold gate
        run: node tools/check/coverage_merge.js --check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-unit/
            coverage-merged/
          retention-days: 14

      - name: Verify SW precache assets
        run: npm run verify:assets

      - name: Vendor asset integrity (manifest ↔ sha256·버전 정합)
        run: npm run check:vendor

      - name: Run parser parity check
        run: npm run check:parser

      - name: Performance budget (SHELL_ASSETS 크기 상한)
        run: npm run check:perf

      - name: Study quality audit (기준선 회귀)
        run: node tools/check/audit_study_quality.js --check

      - name: PR impact report
        if: github.event_name == 'pull_request'
        run: node tools/check/impact_tests.js --ref origin/main

  # E2E는 test 잡과 병렬로 돌린다 — serve.js가 무상태 정적 서빙이라 프로젝트별
  # 분리에 안전. 레그당 ~110 시나리오 + workers:2 (playwright.config.js).
  # chromium만 3샤드 — 지연 사례에서 straggler는 chromium 레그였다.
  # container는 package-lock의 @playwright/test 버전과 맞춘다 — 브라우저+시스템
  # 의존이 이미지에 내장돼 install-deps·브라우저 캐시 단계가 불필요하다.
  e2e:
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'  # 문서 전용 변경 스킵 (changes 잡)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false # 한 프로젝트 실패 시에도 나머지 결과를 확보
      matrix:
        include:
          - { project: chromium, shard: 1, total: 3 }
          - { project: chromium, shard: 2, total: 3 }
          - { project: chromium, shard: 3, total: 3 }
          - { project: mobile, shard: 1, total: 2 }
          - { project: mobile, shard: 2, total: 2 }
          - { project: tablet, shard: 1, total: 2 }
          - { project: tablet, shard: 2, total: 2 }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download generated bundles
        uses: actions/download-artifact@v4
        with:
          name: generated-bundles

      # 이미지와 @playwright/test 버전이 맞으면 no-op — 드리프트 시 브라우저 보정
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E tests (Playwright)
        run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
